name: Shell quality

on:
  push:
    paths:
      - "**.sh"
      - ".github/workflows/quality.yml"
  pull_request:
    paths:
      - "**.sh"
      - ".github/workflows/quality.yml"

permissions:
  contents: read

jobs:
  shellcheck-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test dependency
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Check Bash syntax
        run: for file in songbox.sh tests/*.sh; do bash -n "$file" || exit; done
      - name: Run ShellCheck
        run: shellcheck --severity=warning --shell=bash songbox.sh tests/*.sh
      - name: Test backup, restore, and compatibility paths
        env:
          SONGBOX_TEST_JQ: /usr/bin/jq
        run: |
          bash tests/test_network_tuning.sh
          bash tests/test_backup_restore.sh
          bash tests/test_name_compat.sh
          bash tests/test_decoy_templates.sh
          bash tests/test_subscription_sync.sh
          bash tests/test_singbox_upgrade.sh

  singbox-config-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        singbox: ["1.13.12", "1.14.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test dependency
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Download official sing-box ${{ matrix.singbox }}
        env:
          SB_VERSION: ${{ matrix.singbox }}
        run: |
          archive="$RUNNER_TEMP/sing-box.tar.gz"
          curl -fL --retry 2 -o "$archive" \
            "https://github.com/SagerNet/sing-box/releases/download/v${SB_VERSION}/sing-box-${SB_VERSION}-linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/sing-box"
          tar -xzf "$archive" -C "$RUNNER_TEMP/sing-box" --strip-components=1
      - name: Validate generated configuration with sing-box ${{ matrix.singbox }}
        env:
          SONGBOX_TEST_SB_BIN: ${{ runner.temp }}/sing-box/sing-box
        run: bash tests/test_singbox_compat.sh
